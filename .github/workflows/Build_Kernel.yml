name: 🏗️ Redmi Note 9S Custom Kernel Build

# ─── Trigger ────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      ENABLE_KSU:
        description: "Enable KernelSU?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      ENABLE_LXC:
        description: "Enable LXC / Droidspaces container support?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      KERNEL_NAME:
        description: "Custom kernel local version suffix (e.g. -CustomKernel)"
        required: false
        default: "-CustomKernel-miatoll"
      RELEASE_BUILD:
        description: "Create a GitHub Release with the zip?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# ─── Environment ─────────────────────────────────────────────────────────────
env:
  # Kernel repo info
  KERNEL_REPO: ahksoft/android_kernel_xiaomi_sm6250
  KERNEL_BRANCH: sixteen-qpr2

  # Device / build config
  ARCH: arm64
  DEFCONFIG: vendor/miatoll-perf_defconfig   # confirmed correct for Redmi Note 9S
  DEVICE_CODENAME: miatoll
  DEVICE_FRIENDLY: "Redmi Note 9S"

  # Toolchain: r383902b is correct for kernel 4.14 (Android R era, per ravindu644 toolchain guide)
  # Source: googlesource archive (android-build-prebuilts bucket only hosts newer clang versions)
  CLANG_VERSION: r383902b
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902b.tar.gz
  CLANG_DIR: ${{ github.workspace }}/toolchains/clang

  # GCC cross-compilers (from ravindu644 toolchain guide for 4.19-era Qualcomm kernels)
  GCC_AARCH64: aarch64-linux-android-
  GCC_ARM32: arm-linux-androideabi-

  # Output
  OUT_DIR: ${{ github.workspace }}/out
  ANYKERNEL3_REPO: osm0sis/AnyKernel3
  ANYKERNEL3_BRANCH: master

jobs:
  build:
    name: Build Kernel for Redmi Note 9S (miatoll)
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # needed to create releases

    steps:
      # ── 1. System info ──────────────────────────────────────────────────
      - name: 🖥️ Show runner info
        run: |
          echo "=== Runner: $(uname -a) ==="
          echo "=== CPU cores: $(nproc) ==="
          echo "=== Disk space ==="
          df -h
          echo "=== RAM ==="
          free -h

      # ── 2. Install build dependencies ───────────────────────────────────
      - name: 📦 Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git device-tree-compiler lz4 xz-utils zlib1g-dev \
            libncurses-dev bc bison flex python3 python-is-python3 \
            gcc g++ make cpio kmod openssl libssl-dev libelf-dev \
            pahole ccache zip unzip wget curl ca-certificates \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      # ── 3. Checkout kernel source ────────────────────────────────────────
      - name: 🌲 Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel_source
          fetch-depth: 1

      # ── 4. Download & extract AOSP Clang ────────────────────────────────
      - name: 🔧 Download AOSP Clang ${{ env.CLANG_VERSION }}
        run: |
          mkdir -p ${{ env.CLANG_DIR }}
          echo "Downloading Clang ${{ env.CLANG_VERSION }} (correct version for kernel 4.14)..."

          # Primary: ravindu644 releases mirror (direct .tar.gz, no redirect issues)
          PRIMARY="https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-r383902b.tar.gz"
          # Fallback: googlesource archive
          FALLBACK="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902b.tar.gz"

          if curl -fL --retry 3 --retry-delay 5 -o /tmp/clang.tar.gz "$PRIMARY"; then
            echo "Downloaded from primary mirror."
          else
            echo "Primary failed, trying fallback..."
            curl -fL --retry 3 --retry-delay 5 -o /tmp/clang.tar.gz "$FALLBACK"
          fi

          echo "Extracting..."
          tar -xf /tmp/clang.tar.gz -C ${{ env.CLANG_DIR }}
          rm /tmp/clang.tar.gz

          # Find clang binary (may or may not be in a subdirectory)
          CLANG_BIN=$(find ${{ env.CLANG_DIR }} -name "clang" -type f | head -1)
          if [ -z "$CLANG_BIN" ]; then
            echo "❌ clang binary not found after extraction!"
            ls -la ${{ env.CLANG_DIR }}
            exit 1
          fi
          CLANG_BIN_DIR=$(dirname "$CLANG_BIN")
          echo "CLANG_BIN_DIR=$CLANG_BIN_DIR" >> $GITHUB_ENV
          echo "Clang found at: $CLANG_BIN_DIR"
          "$CLANG_BIN" --version

      # ── 5. Download AnyKernel3 ───────────────────────────────────────────
      - name: 📥 Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/${{ env.ANYKERNEL3_REPO }}.git \
            -b ${{ env.ANYKERNEL3_BRANCH }} \
            ${{ github.workspace }}/AnyKernel3

      # ── 6. Apply KernelSU (optional) ────────────────────────────────────
      - name: 🔑 Apply KernelSU patch (if enabled)
        if: ${{ github.event.inputs.ENABLE_KSU == 'true' }}
        working-directory: kernel_source
        run: |
          echo "Applying KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          echo "KernelSU applied."

      # ── 7. Apply Droidspaces / LXC kernel config patches ────────────────
      #
      #  Based on ravindu644/Droidspaces-OSS Kernel-Configuration docs:
      #  This creates a custom.config fragment with all required options for
      #  LXC namespace + cgroup support (both v1 & v2), network namespaces,
      #  POSIX mqueues, and OverlayFS — required for Droidspaces container runtime.
      #
      - name: 🐋 Prepare Droidspaces LXC kernel config fragment (if enabled)
        if: ${{ github.event.inputs.ENABLE_LXC == 'true' }}
        working-directory: kernel_source
        run: |
          cat > droidspaces.config << 'EOF'
          # ── Droidspaces / LXC Required Kernel Configs ──
          # Based on ravindu644/Droidspaces-OSS Kernel-Configuration.md

          # Namespaces (core requirement)
          CONFIG_NAMESPACES=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          CONFIG_SYSVIPC=y

          # Cgroups (v1 + v2 hybrid for Droidspaces systemd compat)
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_BLK_CGROUP=y
          CONFIG_CPUSETS=y
          CONFIG_CGROUP_HUGETLB=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_CGROUP_NET_CLASSID=y
          CONFIG_CGROUP_PERF=y
          CONFIG_CGROUP_BPF=y

          # cgroup v2 (unified hierarchy for systemd in containers)
          CONFIG_SOCK_CGROUP_DATA=y

          # OverlayFS (required for container rootfs layering)
          CONFIG_OVERLAY_FS=y

          # POSIX Message Queues (mandatory — kABI patch required on 5.10 and below)
          CONFIG_POSIX_MQUEUE=y
          CONFIG_POSIX_MQUEUE_SYSCTL=y

          # Networking for containers
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NET_SCHED=y

          # TUN/TAP (needed for some container networking scenarios)
          CONFIG_TUN=y

          # devtmpfs & mounts
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_TMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y

          # Security/capabilities for containers
          CONFIG_SECURITY=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          # Misc container features
          CONFIG_FUSE_FS=y
          CONFIG_HUGETLBFS=y
          CONFIG_SHMEM=y
          CONFIG_UNIX_DIAG=y
          CONFIG_INET_DIAG=y
          CONFIG_INET_TCP_DIAG=y
          CONFIG_INET_UDP_DIAG=y
          CONFIG_PACKET=y
          CONFIG_PACKET_DIAG=y

          # BPF (Droidspaces uses BPF filters for FBE keyring conflict resolution)
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_HAVE_EBPF_JIT=y

          # BTRFS (optional but useful in containers)
          CONFIG_BTRFS_FS=y

          # Disable CRC module checks (prevents missing .ko boot failures)
          # Based on ravindu644's patches/010.Disable-CRC-Checks.patch
          CONFIG_MODVERSIONS=n
          CONFIG_MODULE_SIG=n
          CONFIG_MODULE_SIG_FORCE=n
          EOF
          echo "droidspaces.config created."

      # ── 8. Apply known source fixes ──────────────────────────────────────
      - name: 🩹 Apply source patches for CI
        working-directory: kernel_source
        run: |
          # Fix netprio_cgroup.h (cgroup->id API change)
          sed -i 's/css->cgroup->id/cgroup_id(css->cgroup)/g' \
            include/net/netprio_cgroup.h 2>/dev/null || true

          # Fix missing ptep declaration in hugetlbpage.c (if present)
          if grep -q "ptep" arch/arm64/mm/hugetlbpage.c 2>/dev/null; then
            sed -i '235i pte_t *ptep;' arch/arm64/mm/hugetlbpage.c || true
          fi

          echo "Source patches applied."

      # ── 9. Set up PATH and build vars ───────────────────────────────────
      - name: ⚙️ Configure build environment
        run: |
          echo "${{ env.CLANG_BIN_DIR }}" >> $GITHUB_PATH
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          mkdir -p ${{ env.OUT_DIR }}

      # ── 10. Generate .config ─────────────────────────────────────────────
      - name: 🛠️ Generate kernel .config
        working-directory: kernel_source
        run: |
          export PATH="${{ env.CLANG_BIN_DIR }}:$PATH"

          # Build make args
          MAKE_ARGS=(
            ARCH=${{ env.ARCH }}
            CC=clang
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
            CLANG_TRIPLE=aarch64-linux-gnu-
            LLVM=1
            LLVM_IAS=1
            O=${{ env.OUT_DIR }}
            -j$(nproc)
          )

          # Load defconfig
          make "${MAKE_ARGS[@]}" ${{ env.DEFCONFIG }}

          # Merge Droidspaces config if LXC enabled
          if [ "${{ github.event.inputs.ENABLE_LXC }}" = "true" ]; then
            echo "Merging Droidspaces LXC config..."
            ./scripts/kconfig/merge_config.sh -m \
              ${{ env.OUT_DIR }}/.config \
              droidspaces.config
            make "${MAKE_ARGS[@]}" olddefconfig
            echo "LXC config merged."
          fi

          # Set kernel local version
          ./scripts/config \
            --file ${{ env.OUT_DIR }}/.config \
            --set-str LOCALVERSION "${{ github.event.inputs.KERNEL_NAME }}"
          make "${MAKE_ARGS[@]}" olddefconfig

          echo "=== Final config summary ==="
          grep -E "^CONFIG_(NAMESPACES|CGROUPS|OVERLAY|KSU|POSIX_MQUEUE|BPF_SYSCALL|USER_NS)=" \
            ${{ env.OUT_DIR }}/.config || true

      # ── 11. Compile the kernel ────────────────────────────────────────────
      - name: 🔨 Compile kernel
        working-directory: kernel_source
        run: |
          export PATH="${{ env.CLANG_BIN_DIR }}:$PATH"

          BUILD_START=$(date +%s)

          make \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 \
            O=${{ env.OUT_DIR }} \
            -j$(nproc) \
            Image.gz-dtb dtbo.img 2>&1 | tee build.log

          BUILD_END=$(date +%s)
          BUILD_DIFF=$((BUILD_END - BUILD_START))
          echo "Build completed in $((BUILD_DIFF / 60))m $((BUILD_DIFF % 60))s"

          # Verify output
          if [ ! -f "${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "❌ ERROR: Kernel image not found! Build failed."
            tail -50 build.log
            exit 1
          fi
          echo "✅ Kernel image built successfully."

      # ── 12. Package with AnyKernel3 ──────────────────────────────────────
      - name: 📦 Package with AnyKernel3
        run: |
          AK3_DIR="${{ github.workspace }}/AnyKernel3"
          KERNEL_IMAGE="${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz-dtb"
          DTBO_IMAGE="${{ env.OUT_DIR }}/arch/arm64/boot/dtbo.img"
          DATE=$(date +%Y%m%d-%H%M)

          # Configure AnyKernel3 for miatoll (Redmi Note 9S)
          cat > "$AK3_DIR/anykernel.sh" << 'AKEOF'
          # AnyKernel3 config for Redmi Note 9S (miatoll)
          # -----------------------------------------------
          properties() { '
          kernel.string=CustomKernel for Redmi Note 9S
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=miatoll
          device.name2=curtana
          device.name3=excalibur
          device.name4=gram
          device.name5=joyeuse
          supported.versions=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;
          . tools/busybox-helper.sh;

          split_boot;
          flash_boot;
          AKEOF

          # Copy kernel artifacts
          cp "$KERNEL_IMAGE" "$AK3_DIR/Image.gz-dtb"
          [ -f "$DTBO_IMAGE" ] && cp "$DTBO_IMAGE" "$AK3_DIR/dtbo.img" || true

          # Build zip name
          KSU_TAG=""
          if [ "${{ github.event.inputs.ENABLE_KSU }}" = "true" ]; then
            KSU_TAG="-KSU"
          fi
          LXC_TAG=""
          if [ "${{ github.event.inputs.ENABLE_LXC }}" = "true" ]; then
            LXC_TAG="-LXC"
          fi

          ZIPNAME="CustomKernel-miatoll${KSU_TAG}${LXC_TAG}-${DATE}.zip"
          echo "ZIPNAME=$ZIPNAME" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV

          cd "$AK3_DIR"
          zip -r9 "${{ github.workspace }}/$ZIPNAME" . \
            -x "*.git*" -x "README.md" -x "*.zip"

          echo "✅ AnyKernel3 zip created: $ZIPNAME"
          ls -lh "${{ github.workspace }}/$ZIPNAME"

      # ── 13. Upload artifact ───────────────────────────────────────────────
      - name: ⬆️ Upload kernel zip (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIPNAME }}
          path: ${{ github.workspace }}/${{ env.ZIPNAME }}
          retention-days: 7

      # ── 14. Upload build log on failure ──────────────────────────────────
      - name: 📋 Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.DATE }}
          path: kernel_source/build.log
          retention-days: 3

      # ── 15. Create GitHub Release ─────────────────────────────────────────
      - name: 🚀 Create GitHub Release
        if: ${{ github.event.inputs.RELEASE_BUILD == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ env.DATE }}
          name: "CustomKernel for Redmi Note 9S — ${{ env.DATE }}"
          body: |
            ## 🏗️ Custom Kernel for Redmi Note 9S (miatoll)

            **Build date:** ${{ env.DATE }}
            **Kernel source:** [${{ env.KERNEL_REPO }}@${{ env.KERNEL_BRANCH }}](https://github.com/${{ env.KERNEL_REPO }}/tree/${{ env.KERNEL_BRANCH }})
            **Compiler:** AOSP Clang ${{ env.CLANG_VERSION }}
            **KernelSU:** ${{ github.event.inputs.ENABLE_KSU }}
            **LXC / Droidspaces:** ${{ github.event.inputs.ENABLE_LXC }}

            ### Features
            - ✅ Android 16 QPR2 base
            - KernelSU: `${{ github.event.inputs.ENABLE_KSU }}`
            - LXC / Droidspaces (namespaces, cgroups v1+v2, OverlayFS, POSIX mqueue, BPF): `${{ github.event.inputs.ENABLE_LXC }}`
            - ✅ AnyKernel3 flashable zip

            ### Supported devices
            | Codename | Device |
            |---|---|
            | curtana | Redmi Note 9S |
            | gram | Redmi Note 9 Pro |
            | joyeuse | Redmi Note 9 Pro Max |
            | excalibur | Mi 10i / Mi 10T Lite |

            ### How to flash
            1. Boot into custom recovery (TWRP / OrangeFox)
            2. Flash the zip
            3. Reboot

            > ⚠️ This is a custom kernel. Flash at your own risk.
          files: ${{ github.workspace }}/${{ env.ZIPNAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
