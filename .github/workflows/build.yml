name: Xiaomi SM6250 Kernel Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Kernel
        # Updated to the new repository name
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com
          kernel-branch: master
          config: joyeuse_user_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          aosp-clang-version: r416183b
          
          extra-cmd: |
            # 1. Integrate KernelSU Next (Legacy)
            curl -LSs "https://githubusercontent.com" | bash -s next-legacy

            # 2. Append DroidSpaces configurations to the defconfig
            cat <<EOF >> arch/arm64/configs/joyeuse_user_defconfig
            # DroidSpaces IPC & Namespaces
            CONFIG_SYSCTL=y
            CONFIG_SYSVIPC=y
            CONFIG_POSIX_MQUEUE=y
            CONFIG_NAMESPACES=y
            CONFIG_PID_NS=y
            CONFIG_UTS_NS=y
            CONFIG_IPC_NS=y
            # Hardening & Cgroups
            CONFIG_SECCOMP=y
            CONFIG_SECCOMP_FILTER=y
            CONFIG_CGROUPS=y
            CONFIG_CGROUP_DEVICE=y
            CONFIG_CGROUP_PIDS=y
            CONFIG_MEMCG=y
            CONFIG_CGROUP_SCHED=y
            CONFIG_FAIR_GROUP_SCHED=y
            CONFIG_CGROUP_FREEZER=y
            CONFIG_CGROUP_NET_PRIO=y
            # Hardware & Network Isolation
            CONFIG_DEVTMPFS=y
            CONFIG_OVERLAY_FS=y
            CONFIG_FW_LOADER=y
            CONFIG_FW_LOADER_USER_HELPER=y
            CONFIG_FW_LOADER_COMPRESS=y
            CONFIG_NET_NS=y
            CONFIG_VETH=y
            CONFIG_BRIDGE=y
            CONFIG_NETFILTER=y
            CONFIG_BRIDGE_NETFILTER=y
            CONFIG_NETFILTER_ADVANCED=y
            CONFIG_NF_CONNTRACK=y
            CONFIG_NF_CONNTRACK_IPV4=y
            CONFIG_IP_NF_IPTABLES=y
            CONFIG_IP_NF_FILTER=y
            CONFIG_NF_NAT=y
            CONFIG_NF_TABLES=y
            CONFIG_NF_NAT_IPV4=y
            CONFIG_IP_NF_NAT=y
            CONFIG_IP_NF_TARGET_MASQUERADE=y
            CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
            CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
            CONFIG_NF_CONNTRACK_NETLINK=y
            CONFIG_NF_NAT_REDIRECT=y
            CONFIG_IP_ADVANCED_ROUTER=y
            CONFIG_IP_MULTIPLE_TABLES=y
            CONFIG_ANDROID_PARANOID_NETWORK=n
            EOF
