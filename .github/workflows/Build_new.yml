name: Xiaomi SM6250 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Checkout kernel source
      - name: Checkout Kernel Source
        uses: actions/checkout@v3
        with:
          repository: ahksoft/android_kernel_xiaomi_sm6250
          ref: sixteen-qpr2

      # 2. Install build dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coccinelle build-essential libncurses-dev bc bison flex clang lld \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf

      # 3. Apply source patches for CI build
      - name: Patch kernel source for CI
        run: |
          # Fix netprio_cgroup.h (cgroup->id)
          sed -i 's/css->cgroup->id/cgroup_id(css->cgroup)/g' include/net/netprio_cgroup.h || true
          # Declare missing 'ptep' in hugetlbpage.c
          sed -i '235i pte_t *ptep;' arch/arm64/mm/hugetlbpage.c || true
          # Disable perf tracepoints
          scripts/config --disable TRACEPOINTS || true

      # 4. Kernel build
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@v1.10.1
        with:
          kernel-url: https://github.com/ahksoft/android_kernel_xiaomi_sm6250
          kernel-branch: sixteen-qpr2
          config: defconfig
          arch: arm64
          android-version: 16
          aosp-clang: true
          aosp-gcc: true 
          aosp-clang-version: r416183b
          ksu: false
          ksu-other: false
          lxc: true
          anykernel3: true
          release: true
          extra-make-args: -j$(nproc) V=1
