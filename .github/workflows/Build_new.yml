name: Xiaomi SM6250 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Step 1: Checkout kernel source
      - name: Checkout Kernel Source
        uses: actions/checkout@v3
        with:
          repository: ahksoft/android_kernel_xiaomi_sm6250
          ref: sixteen-qpr2

      # Step 2: Install dependencies (Coccinelle for kernel patching)
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coccinelle build-essential libncurses-dev bc bison flex

      # Step 3: Kernel build using dabao1955 action
      - name: Android Kernel Build Action
        uses: dabao1955/kernel_build_action@v1.10.1
        with:
          kernel-url: https://github.com/ahksoft/android_kernel_xiaomi_sm6250
          kernel-branch: sixteen-qpr2
          config: defconfig
          arch: arm64
          android-version: 16

          # Toolchain
          aosp_clang_version: r547379
          android_ndk: true
          aosp_gcc: false

          # KernelSU Next Integration
          ksu: false
          ksu-other: false
          ksu-url: https://github.com/KernelSU-Next/KernelSU-Next
          ksu-version: legacy-susfs

          # DroidSpaces / container support
          lxc: true
          lxc-patch: false

          # Packaging
          anykernel3: true
          release: true

          # Verbose build output
          extra-cmd: V=1
